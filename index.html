
<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8" />
        <title>Calendar Widget</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <div class="calendar-widget">
            <div class="calendar-header">
                <span id="month"></span>
                <span id="year"></span>
            </div>

            <div id="calendar-body">
                <div id="weekdays">
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                    <div>Sun</div>
                </div>

                <div id="calendar-grid"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
